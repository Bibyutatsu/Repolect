name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write    # Required for OIDC Trusted Publishers
  contents: read     # ← ADD THIS — allows checkout to work

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ← add this too for the warning

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build
      run: pip install build

    - name: Check version matches release tag
      run: |
        PKG_VERSION=$(python -c "
        import ast, sys
        with open('repolect/version.py') as f:
            tree = ast.parse(f.read())
        for node in ast.walk(tree):
            if isinstance(node, ast.Assign):
                for t in node.targets:
                    if isinstance(t, ast.Name) and t.id == '__version__':
                        print(ast.literal_eval(node.value))
                        sys.exit(0)
        sys.exit(1)
        ")
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ version.py says $PKG_VERSION but release tag is $TAG_VERSION"
          exit 1
        fi
        echo "✅ Version $PKG_VERSION matches tag"

    - name: Build sdist and wheel
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
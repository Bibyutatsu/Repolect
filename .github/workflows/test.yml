name: CI

on:
  push:
    branches: [ main, stage ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4          # ← unpinned to always use latest v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5      # ← unpinned to always use latest v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,mcp]"

    - name: Check tree-sitter-languages availability
      run: |
        python -c "import tree_sitter_languages; print('tree-sitter-languages OK')" || \
          echo "tree-sitter-languages not available, parser tests will be skipped"

    - name: Run tests
      run: pytest tests/ -v --tb=short

    - name: Lint with ruff
      run: ruff check repolect/ --select E,F,W --ignore E501
      continue-on-error: true